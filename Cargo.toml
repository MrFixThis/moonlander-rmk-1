[package]
name = "moonlander-rmk-1"
edition = "2024"
version = "0.1.0"
authors = ["MrFixThis <mrfixthis55@gmail.com>"]
description = "RMK-based firmware for the Moonlander MK I keyboard"
repository = "https://github.com/MrFixThis/moonlander-rmk-1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "moonlander-rmk-1"
test = false
bench = false

[features]
default = ["rgb", "locks"]
indicators = []
locks = ["indicators"]
rgb = [
    "dep:rmk-palettefx",
    "dep:sequential-storage",
    "dep:serde"
]
halfmoon = []
debounce_fast = []
defmt = [
    "dep:panic-probe",
    "dep:defmt-rtt",
    "dep:defmt",
    "rmk/defmt",
    "embassy-stm32/defmt",
    "embassy-executor/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-embedded-hal/defmt"
]

[dependencies]
rmk = { version = "0.9.0", default-features = false }
rmk-palettefx = { version = "0.2.0", optional = true }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f303cb",
    "time-driver-tim15",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5.1", default-features = false, features = ["tick-hz-32_768"] }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-futures = "0.1.2"
embassy-embedded-hal = { version = "0.6.0", default-features = false }
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.6", features = ["set-vtor"] }
static_cell = "2.1.1"
defmt = { version = "1.1", optional = true }
defmt-rtt = { version = "1.3.1", optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
panic-halt = "1.0"
serde = { version = "1.0.229", default-features = false, optional = true }
sequential-storage = { version = "8.0.2", default-features = false, optional = true }

[profile.dev]
codegen-units = 1
panic = "unwind"
debug = true
opt-level = "s"
overflow-checks = true
lto = true

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
overflow-checks = false
lto = true
strip = true

[profile.release-dbg]
panic = "unwind"
inherits = "release"
debug = true
strip = false
